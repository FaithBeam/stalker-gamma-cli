name: .NET Core Desktop

on:
  push:
    paths-ignore:
      - README.md
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run Csharpier
        run: |
          dotnet tool restore
          dotnet csharpier check .

  version:
    name: version
    runs-on: ubuntu-22.04
    outputs:
      semver: ${{ steps.gitversion.outputs.SemVer }}
      file_version: ${{ steps.gitversion.outputs.AssemblySemFileVer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.x"

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: [lint, version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
            build: make build appimage -C build/linux VERSION=$FILE_VERSION ARCH=x64
            artifact: build/linux/stalker-gamma+linux.x64.AppImage
            server_artifact: build/linux/stalker-gamma-server+linux.x64.AppImage
          - platform: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            build: make build appimage -C build/linux VERSION=$FILE_VERSION ARCH=arm64
            artifact: build/linux/stalker-gamma+linux.arm64.AppImage
            server_artifact: build/linux/stalker-gamma-server+linux.arm64.AppImage
          - platform: macos
            arch: x64
            runner: macos-15-intel
            build: make build archive -C build/mac VERSION=$FILE_VERSION ARCH=x64
            artifact: build/mac/stalker-gamma+mac.x64.tar.gz
            server_artifact: build/mac/stalker-gamma-server+mac.x64.tar.gz
          - platform: macos
            arch: arm64
            runner: macos-15
            build: make build archive -C build/mac VERSION=$FILE_VERSION ARCH=arm64
            artifact: build/mac/stalker-gamma+mac.arm64.tar.gz
            server_artifact: build/mac/stalker-gamma-server+mac.arm64.tar.gz
          - platform: win
            arch: x64
            runner: windows-latest
            build: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build/win/build.ps1 -Version $FILE_VERSION -Arch x64
            artifact: stalker-gamma+win.x64.zip
            server_artifact: stalker-gamma-server+win.x64.zip
          - platform: win
            arch: arm64
            runner: windows-11-arm
            build: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build/win/build.ps1 -Version $FILE_VERSION -Arch arm64
            artifact: stalker-gamma+win.arm64.zip
            server_artifact: stalker-gamma-server+win.arm64.zip
    # each leg only sets its own hash; the empty ones don't overwrite the other legs'
    outputs:
      linux_x64_sha256: ${{ steps.hash.outputs.linux_x64_sha256 }}
      linux_arm64_sha256: ${{ steps.hash.outputs.linux_arm64_sha256 }}
      macos_x64_sha256: ${{ steps.hash.outputs.macos_x64_sha256 }}
      macos_arm64_sha256: ${{ steps.hash.outputs.macos_arm64_sha256 }}
      linux_x64_server_sha256: ${{ steps.hash.outputs.linux_x64_server_sha256 }}
      linux_arm64_server_sha256: ${{ steps.hash.outputs.linux_arm64_server_sha256 }}
      macos_x64_server_sha256: ${{ steps.hash.outputs.macos_x64_server_sha256 }}
      macos_arm64_server_sha256: ${{ steps.hash.outputs.macos_arm64_server_sha256 }}
      win_x64_sha256: ${{ steps.hash.outputs.win_x64_sha256 }}
      win_arm64_sha256: ${{ steps.hash.outputs.win_arm64_sha256 }}
      win_x64_server_sha256: ${{ steps.hash.outputs.win_x64_server_sha256 }}
      win_arm64_server_sha256: ${{ steps.hash.outputs.win_arm64_server_sha256 }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        env:
          FILE_VERSION: ${{ needs.version.outputs.file_version }}
        run: ${{ matrix.build }}

      - name: Hash
        id: hash
        run: |
          hash=$(sha256sum "${{ matrix.artifact }}" | cut -d ' ' -f 1)
          echo "${{ matrix.platform }}_${{ matrix.arch }}_sha256=$hash" >> $GITHUB_OUTPUT
          server_hash=$(sha256sum "${{ matrix.server_artifact }}" | cut -d ' ' -f 1)
          echo "${{ matrix.platform }}_${{ matrix.arch }}_server_sha256=$server_hash" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.server_artifact }}
          token: ${{ secrets.STALKER_GAMMA_CLI_SECRET }}

  print-hashes:
    name: print-hashes
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Print hashes
        env:
          HASHES: ${{ toJSON(needs.build.outputs) }}
        run: echo "$HASHES"

  update-aur:
    name: update-aur
    runs-on: ubuntu-22.04
    needs: [build, version]
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate PKGBUILD
        run: |
          PATH_TO_PKGBUILD="PKGBUILD"
          chmod +x "./build/update-pkgbuild.sh"
          ./build/update-pkgbuild.sh "${{ needs.version.outputs.semver }}" "${{ needs.build.outputs.linux_arm64_sha256 }}" "${{ needs.build.outputs.linux_x64_sha256 }}" "$PATH_TO_PKGBUILD"

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: stalker-gamma-cli-bin
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_KEY_PRIVATE }}
          commit_message: Update AUR package
          ssh_keyscan_types: ed25519
          
 
  update-chocolatey:
    name: update-chocolatey
    runs-on: windows-latest
    needs: [build, version]
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create and Push Chocolatey Package
        if: github.ref_type == 'tag'
        run: build/win/chocolatey.bat ${{ needs.version.outputs.semver }} ${{ secrets.CHOCOLATEY_API_KEY }} ${{ needs.build.outputs.win_x64_sha256 }} ${{ needs.build.outputs.win_arm64_sha256 }} ${{ needs.build.outputs.win_x64_server_sha256 }} ${{ needs.build.outputs.win_arm64_server_sha256 }}

  update-homebrew:
    name: update-homebrew
    runs-on: ubuntu-22.04
    needs: [build, version]
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v7
        
      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          repository: FaithBeam/homebrew-stalker-gamma
          token: ${{ secrets.HOMEBREW_REPO_TOKEN }}
          path: homebrew-stalker-gamma

      - name: Update Homebrew Cask
        run: |
          PATH_TO_CASK="homebrew-stalker-gamma/Casks/stalker-gamma.rb"
          chmod +x "./build/update-cask.sh"
          ./build/update-cask.sh "${{ needs.version.outputs.semver }}" "${{ needs.build.outputs.macos_arm64_sha256 }}" "${{ needs.build.outputs.macos_x64_sha256 }}" "$PATH_TO_CASK"
          git -C homebrew-stalker-gamma config user.name "github-actions[bot]"
          git -C homebrew-stalker-gamma config user.email "github-actions[bot]@users.noreply.github.com"
          git -C homebrew-stalker-gamma add .
          git -C homebrew-stalker-gamma commit -m "Update $PATH_TO_CASK"
          git -C homebrew-stalker-gamma push